<text x="40" y="52" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="start">wsr.wm: tell a world model what changed</text>
