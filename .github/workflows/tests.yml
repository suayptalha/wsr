name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -e ".[dev]"
      - run: python -c "from huggingface_hub import hf_hub_download as d; d('gpt2', 'tokenizer.json')"
      - run: pytest -q
